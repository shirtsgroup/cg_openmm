name: test
channels:
  - conda-forge
  - nodefaults
dependencies:
  - libnetcdf <4.9  # avoid netcdf-c 4.9 deflate/string-var regression (openmmtools reporter)
  - matplotlib-base
  - mdtraj
  - mpi4py
  - numpy
  - openmm
  - openmmtools=0.21.1
  - physical_validation
  - pickleshare
  - pip
  - pymbar=3
  - pytest
  - pytest-cov
  - python
  - pyyaml
  - scikit-learn
  - scipy
  - yaml

  # Pip-only installs
  - pip:
    - codecov
    - git+https://github.com/shirtsgroup/analyze_foldamers.git

