name: cg_openmm
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.9,<3.12
  - libnetcdf <4.9  # avoid netcdf-c 4.9 deflate/string-var regression (openmmtools reporter)
  - matplotlib-base
  - mdtraj
  - numpy
  - openmm
  - openmmtools=0.21.1
  - physical_validation
  - pymbar=3
  - scikit-learn
  - scipy
  - pip
